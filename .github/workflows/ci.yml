name: Helios CI & Container Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate Dependencies & Syntax
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m py_compile src/telemetry_generator.py
        python -m py_compile src/autoencoder_eval.py
        python -m py_compile src/yield_forecaster.py

    - name: Build Docker Container
      run: |
        docker build -t helios-telemetry-engine:latest .

    - name: Verify Container Execution
      run: |
        docker run --rm helios-telemetry-engine:latest python -c 'import torch, sklearn, pandas; print("Container Environment Verified: PyTorch", torch.__version__)'
