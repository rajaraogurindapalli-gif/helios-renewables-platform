name: Helios Multi-Stage CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: 🧪 Stage 1 - Unit & Physics Regression Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      GCP_PROJECT: responsive-sun-313908

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Runtime & Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest

    - name: Syntax Compilation Check
      run: |
        python -m py_compile src/config.py
        python -m py_compile src/telemetry_generator.py
        python -m py_compile src/autoencoder_eval.py
        python -m py_compile src/yield_forecaster.py

    - name: Execute IEC 61724-1 & Model Unit Tests
      run: |
        PYTHONPATH=. pytest tests/ -v

    - name: Build Test Docker Image
      run: |
        docker build -t helios-telemetry-engine:test .

  promote-production:
    name: 🚀 Stage 2 - Production Container Verification
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
      GCP_PROJECT: responsive-sun-313908

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build Production Container Image
      run: |
        docker build -t helios-telemetry-engine:production .

    - name: Verify Production Container Entrypoint
      run: |
        docker run --rm -e APP_ENV=prod helios-telemetry-engine:production python -c "from src.config import settings; print('Production Container Ready: Ingestion Target ->', settings.GOLD_DATASET)"
