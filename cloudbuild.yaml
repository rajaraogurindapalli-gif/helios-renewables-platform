steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/helios-telemetry-engine:latest', '.']

  # Push the container image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/helios-telemetry-engine:latest']

images:
  - 'gcr.io/$PROJECT_ID/helios-telemetry-engine:latest'

options:
  logging: CLOUD_LOGGING_ONLY
